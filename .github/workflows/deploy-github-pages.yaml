name: Deploy to GitHub Pages

on:
  # Trigger manual (útil para testar)
  workflow_dispatch:

  # Trigger vindo do repositório Vault
  repository_dispatch:
    types: [sync-vault-content]

  # Opcional: também dispara em push direto no blog (ex: mudanças de layout)
  push:
    branches:
      - v4
    paths-ignore:
      - "content/**" # evita loop se alguém commitar content direto

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Blog (código-fonte)
        uses: actions/checkout@v6
        with:
          ref: v4
          fetch-depth: 0 # histórico completo (necessário para o Quartz)

      - name: Checkout DevSecOps Vault (Private Notes)
        uses: actions/checkout@v6
        with:
          repository: devpolatto/DevSecOps-Vault
          token: ${{ secrets.VAULT_ACCESS_TOKEN }}
          path: vault-content
          ref: master

      - name: Sync DevSecOps Vault content -> content/
        run: |
          echo "🔄 Sync DevSecOps Vault..."

          find content/ -name "*.md" -not -name "index.md" -delete

          rsync -av --include="*.md" --include="*.png" --include="*.jpg" \
                    --include="*.svg" --include="*.gif" \
                    --include="*/" --exclude="*" \
                    --exclude=".git/" \
                    --exclude=".vscode/" \
                    --exclude=".obsidian/" \
                    --exclude=".trash/" \
                    --exclude="Templates/" \
                    vault-content/ content/

          echo "✅ Sync DevSecOps Vault Finished!"
          echo "📝 Notes synced:"
          find content/ -name "*.md" | wc -l

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Disable Jekyll processing
        run: touch public/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
